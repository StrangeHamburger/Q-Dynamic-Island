<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>灵动岛设置</title>
  <link rel="stylesheet" href="menu.css" />
</head>
<body>
  <div class="menu">
    <div class="menu-head">
      <span class="menu-title">灵动岛</span>
      <button class="menu-close" id="menuClose" aria-label="关闭菜单" title="关闭">×</button>
    </div>
    <label class="menu-item">
      <input type="checkbox" id="pinCheck" />
      <span>固定位置</span>
    </label>
    <div class="menu-item menu-row" id="styleRow">
      <span class="menu-label">律动</span>
      <div class="style-grid" id="styleGrid">
        <button class="style-btn" data-style="none" title="无"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M6 6l12 12"/></svg></button>
        <button class="style-btn" data-style="wave" title="波浪"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12c2.5-6 5-6 7.5 0s5 6 7.5 0"/></svg></button>
        <button class="style-btn" data-style="bars" title="柱状"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="10" width="4" height="8" rx="1"/><rect x="10" y="5" width="4" height="13" rx="1"/><rect x="16" y="8" width="4" height="10" rx="1"/></svg></button>
        <button class="style-btn" data-style="ripple" title="涟漪"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" opacity="0.55"/><circle cx="12" cy="12" r="10" opacity="0.3"/></svg></button>
        <button class="style-btn" data-style="sweep" title="流光"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18L18 6"/><circle cx="17" cy="8" r="1.8"/></svg></button>
      </div>
    </div>
    <div class="menu-item menu-row">
      <span class="menu-label">大小</span>
      <input type="range" id="scaleSlider" min="0.67" max="1" step="0.01" />
      <span class="menu-value" id="scaleValue">100%</span>
    </div>
    <div class="menu-item menu-row">
      <span class="menu-label">透明度</span>
      <input type="range" id="bgOpacitySlider" min="0.2" max="1" step="0.01" />
      <span class="menu-value" id="bgOpacityValue">92%</span>
    </div>
    <div class="menu-sep"></div>
    <div class="menu-item menu-danger" id="menuQuit">退出</div>
  </div>
  <script src="menu.js"></script>
</body>
</html>
